mission_node:
  ros__parameters:
    # State machine monitor rate [Hz].
    update_hz: 2.0

    # Battery fraction below which the mission automatically triggers return [0–1].
    # PX4's own failsafe still applies; this is an application-level early trigger.
    low_battery_threshold: 0.20

    # Seconds to wait for vehicle to arm before aborting the start sequence.
    arm_timeout_s: 10.0

    # Seconds to wait for transit to complete before starting search anyway.
    transit_timeout_s: 300.0

    # Seconds in TRACKING before the mission forces a resume of SEARCH.
    # Guidance's own confidence gate usually returns earlier (target lost);
    # this is the mission-level backstop.
    track_timeout_s: 120.0

    # ── Search area preset (ADR-012/ADR-015/ADR-018) ─────────────────────────
    # A beachfront swim zone is a strip, not a circle. Applied only when
    # CMD_START itself doesn't select a strip (search_length_m <= 0) — the
    # default 0.0 here keeps the circular area (search_radius_m in the
    # CMD_START request), unchanged from before ADR-018.
    search_length_m: 0.0     # [m] along-shore extent; 0 = circle
    search_width_m: 120.0    # [m] cross-shore extent
    shore_bearing_rad: 0.0   # [rad] ENU bearing of the shoreline (REP-103)
    # Altitude envelope, metres ABOVE HOME. CMD_START altitudes are AMSL and
    # are converted to height above home, then rejected if outside this band.
    min_alt_above_home_m: 10.0
    max_alt_above_home_m: 120.0   # CASA standard-operating ceiling (400 ft AGL)
